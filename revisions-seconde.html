<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f3fd6">
<title>Révisions — Seconde</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f3fd6'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
/* Révisions — Semaine 3 · Seconde — mobile-first (360–430 px), confortable sur ordinateur */
:root {
  --bg: #f3f2fa; --surface: #ffffff; --ink: #1c1b33; --muted: #666481; --line: #e3e1f1;
  --brand: #4f3fd6; --brand-2: #7a5cf5; --brand-soft: #ecebff;
  --green: #14833b; --green-soft: #e4f5ea; --orange: #c46a00; --orange-soft: #fff1dc; --red: #cc2b2b; --red-soft: #fde9e9;
  --pc: #0d8f86; --maths: #4f46e5; --espagnol: #d9530a; --anglais: #0a78b8; --francais: #c2226f; --snt: #6b21a8;
  --accent: var(--brand);
  --radius: 18px; --shadow: 0 8px 28px rgba(45, 34, 120, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1022; --surface: #1a1b33; --ink: #f0efff; --muted: #a5a4c4; --line: #2c2d4d;
    --brand: #8d7fff; --brand-2: #a78bff; --brand-soft: #26244d;
    --green: #4cd37e; --green-soft: #12301f; --orange: #ffb04d; --orange-soft: #372813; --red: #ff7a7a; --red-soft: #3a1a1d;
    --pc: #2dd4c7; --maths: #8d92ff; --espagnol: #ff9a5c; --anglais: #58bdf5; --francais: #ff6fb1; --snt: #c299f2;
    --shadow: 0 8px 28px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
#app { max-width: 560px; margin: 0 auto; }
h1, h2, p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.h2 { font-size: 16px; margin-bottom: 8px; }

/* ── Boutons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 16px; border: 1.5px solid transparent; font-weight: 650; cursor: pointer; text-decoration: none; text-align: center; transition: transform .08s, background .15s, opacity .15s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--brand); color: #fff; }
.btn.ghost { background: var(--surface); border-color: var(--line); }
.btn.danger { background: var(--red); color: #fff; }
.btn.danger-ghost { width: 100%; margin-top: 16px; background: transparent; border-color: color-mix(in srgb, var(--red) 45%, transparent); color: var(--red); }
.btn.sm { min-height: 42px; padding: 8px 14px; font-size: 15px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; color: var(--ink); font-size: 20px; cursor: pointer; text-decoration: none; }
.icon-btn:hover { background: var(--brand-soft); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; cursor: pointer; font-size: 14px; }

.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .35s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }

/* ── Accueil ── */
.view { padding: 16px 16px 40px; }
.home-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: 4px; }
.home-title { font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; display: flex; flex-direction: column; }
.home-title .week { color: var(--brand); }
.home-sub { color: var(--muted); margin-top: 6px; font-weight: 550; }
.streak { background: var(--orange-soft); color: var(--orange); padding: 8px 12px; border-radius: 99px; font-weight: 650; white-space: nowrap; font-size: 15px; }
.warn { margin-top: 12px; background: var(--orange-soft); color: var(--orange); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.subj-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 18px; }
.subj-grid .subj-card { grid-column: span 2; } /* 3 cartes par ligne, quel que soit le nombre de matières */
.subj-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 9px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 14px; text-decoration: none; min-height: 88px; }
.subj-card .ico { font-size: 20px; line-height: 1; }
.subj-card .nm { font-size: 12.5px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; hyphens: auto; letter-spacing: -.01em; }
.subj-card .bar { height: 5px; margin-top: auto; }
.subj-card .bar > i { background: var(--accent); }
.subj-card .pc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-card .row-between { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.progress-card .lbl { font-weight: 650; font-size: 15px; }
.progress-card .big { white-space: nowrap; }
.big { font-size: 22px; font-weight: 800; }
.ind3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; text-align: center; }
.ind .n { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ind .l { font-size: 12.5px; color: var(--muted); }
.newline { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }
.resume { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-color: var(--brand); }
.resume-btns { display: flex; gap: 8px; }
.recap { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--brand-soft); display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; }
.recap b { font-size: 15px; }
.recap.due { background: var(--red-soft); }
.recap.ok { background: var(--green-soft); }
.cta { width: 100%; margin-top: 14px; padding: 20px 18px; border: 0; border-radius: 22px; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 12px 30px color-mix(in srgb, var(--brand) 40%, transparent); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .1s; }
.cta:active { transform: scale(.985); }
.cta-main { font-size: 21px; font-weight: 800; }
.cta-sub { font-size: 14px; opacity: .9; }
.cta.small { padding: 14px; border-radius: 18px; background: var(--accent); box-shadow: none; }
.cta.small .cta-main { font-size: 17px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.mode { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; min-height: 84px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; font-weight: 650; cursor: pointer; text-align: left; }
.mode .mi { font-size: 22px; }
.mode-sub { font-size: 12px; color: var(--muted); font-weight: 500; }
.badge { position: absolute; top: 10px; right: 10px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 99px; background: var(--red); color: #fff; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
.home-links { text-align: center; margin-top: 18px; }
.home-links a { color: var(--brand); font-weight: 600; }
.foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }

/* ── Vues secondaires ── */
.topbar { display: flex; align-items: center; gap: 6px; margin: 0 -8px 6px; }
.topbar-title { font-size: 22px; font-weight: 800; }
.lead { color: var(--muted); margin: 4px 0 6px; }
.subj-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.subj-row { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 16px; text-decoration: none; }
.subj-row .ico { font-size: 26px; }
.subj-row .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.subj-row .nm { font-weight: 700; }
.subj-row .bar > i { background: var(--accent); }
.subj-row .pc { color: var(--muted); font-variant-numeric: tabular-nums; }
.sblock { border-top: 4px solid var(--accent); }
.sblock-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sblock-head .ico { font-size: 22px; }
.sblock-head h2 { font-size: 17px; }
.sblock .bar > i { background: var(--accent); }
.mod { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 4px; }
.mod:first-of-type { margin-top: 12px; }
.mod-head { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 46px; background: none; border: 0; text-align: left; cursor: pointer; padding: 6px 0; }
.mod-name { flex: 1; font-weight: 650; }
.chev { color: var(--muted); font-size: 22px; transition: transform .2s; }
.mod.open .chev { transform: rotate(90deg); }
.mod-list { display: flex; flex-direction: column; gap: 4px; padding: 0 0 8px 4px; }
.skill-row { display: flex; align-items: center; gap: 10px; min-height: 46px; width: 100%; padding: 6px 10px; border-radius: 12px; background: var(--bg); border: 0; text-align: left; cursor: pointer; }
.skill-row:hover { background: var(--brand-soft); }
.skill-name { flex: 1; font-size: 15px; }
.skill-due { font-size: 12.5px; color: var(--muted); }
.skill-row .go { color: var(--accent); font-size: 12px; }
.skill-row.big { padding: 12px; background: var(--surface); border: 1px solid var(--line); }
.skill-row .col { flex: 1; display: flex; flex-direction: column; }
.card.list { display: flex; flex-direction: column; gap: 8px; }
.card.empty { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
.stats3 .l { display: block; font-size: 12.5px; color: var(--muted); }
.hist-row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.worked { border-left: 5px solid var(--accent); }
.worked h2 { font-size: 17px; margin-bottom: 4px; }
.worked.pending { border-left-color: var(--line); background: var(--bg); box-shadow: none; }
.worked.pending h2 { font-size: 15px; color: var(--muted); font-weight: 700; }
.worked-week { margin: 18px 4px 2px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.worked-week:first-of-type { margin-top: 10px; }
.week-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.week-row { display: flex; align-items: flex-start; gap: 10px; font-size: 14.5px; }
.week-row .ico { flex: 0 0 auto; }

/* ── Fin de session ── */
.sum-head { text-align: center; padding: 18px 0 4px; }
.check { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.sum-head h1 { font-size: 26px; }
.sum-big { font-size: 18px; margin-top: 4px; color: var(--muted); font-weight: 600; }
.prio { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.prio li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--bg); border-radius: 10px; }
.sum-line { text-align: center; margin-top: 12px; font-weight: 600; }
.sum-line.muted { font-weight: 500; font-size: 14px; }
.sum-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

/* ── Session ── */
.session { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto; }
.s-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px 6px; flex: 0 0 auto; }
.s-bar { flex: 1; }
.s-bar > i { background: var(--accent); }
.s-count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.s-main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 16px 10px; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
.s-card { margin: auto 0; width: 100%; }
.s-card.enter { animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.s-tagrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.s-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 4px 10px; border-radius: 99px; max-width: 100%; }
.s-tag .sd { display: none; }
.chip-mini { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 7px; font-size: 11px; margin-left: 4px; font-weight: 750; letter-spacing: .02em; }
.chip-mini.new { background: var(--green); }
.chip-mini.reactivation { background: var(--orange); }
.hint-btn { background: transparent; border: 1.5px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.hint-btn:disabled { opacity: .5; }
.hint-box { background: var(--orange-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; margin: 6px 0 2px; }
.s-foot { flex: 0 0 auto; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
.s-action { width: 100%; }
.s-panel { margin-top: 12px; }
.s-panel:empty { margin: 0; }

.prompt { font-size: clamp(18px, 4.9vw, 22px); line-height: 1.32; font-weight: 650; margin: 8px 0 14px; overflow-wrap: anywhere; }
.prompt.small { font-size: clamp(16px, 4.3vw, 18px); }
.prompt.statement { padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 12px; font-weight: 600; }
.prompt.card { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.prompt.en { font-size: clamp(19px, 5.2vw, 23px); }
.kicker { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-top: 6px; }
.blank { display: inline-block; min-width: 2.2em; border-bottom: 3px solid var(--accent); margin: 0 3px; transform: translateY(-2px); }

.choices { display: grid; gap: 9px; }
.choices.cols2 { grid-template-columns: 1fr 1fr; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; font-weight: 550; transition: border-color .12s, background .12s, transform .08s; line-height: 1.3; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:active:not(:disabled) { transform: scale(.985); }
.choice .k { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 750; display: inline-flex; align-items: center; justify-content: center; }
.choice .t { flex: 1; overflow-wrap: anywhere; }
.choice:disabled { cursor: default; }
.choice.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.choice.correct { border-color: var(--green); background: var(--green-soft); }
.choice.wrong { border-color: var(--red); background: var(--red-soft); }
.choice.dim { opacity: .55; }
.cols2 .choice { justify-content: center; font-size: 18px; font-weight: 700; min-height: 60px; }
.cols2 .choice .k { display: none; }
@media (hover: none) { .choice .k { display: none; } }

.answer-row { display: flex; align-items: center; gap: 10px; }
.field { flex: 1; min-width: 0; width: 100%; font: inherit; font-size: 20px; font-weight: 650; padding: 13px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.field:focus { outline: none; border-color: var(--accent); }
.field.ok { border-color: var(--green); background: var(--green-soft); }
.field.bad { border-color: var(--red); background: var(--red-soft); }
.field.area { font-size: 16px; font-weight: 500; resize: none; line-height: 1.4; }
.unit { font-size: 20px; font-weight: 700; color: var(--muted); }
.field-err { min-height: 20px; margin-top: 6px; font-size: 14px; color: var(--red); }

.chain { display: flex; align-items: flex-start; justify-content: center; gap: 0; margin: 4px 0 10px; padding-bottom: 20px; }
.chain-node { width: 76px; padding: 8px 4px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 750; letter-spacing: .03em; }
.chain-node .ico { font-size: 22px; }
.chain-arrow { position: relative; flex: 0 0 50px; height: 62px; display: flex; align-items: center; justify-content: center; }
.chain-arrow .ar { font-size: 22px; color: var(--muted); }
.chain-arrow .lab { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 11.5px; font-weight: 650; white-space: nowrap; color: var(--ink); }
.chain-arrow.q .lab { color: #fff; background: var(--accent); border-radius: 99px; padding: 0 8px; top: 62px; }

.order-head { display: flex; align-items: flex-start; gap: 6px; }
.order-head .prompt { flex: 1; }
.order-head .linkbtn { padding: 4px 2px; margin-top: 6px; }
.pool { display: flex; flex-direction: column; gap: 4px; margin-top: 0; }
.chip { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 5px 9px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 13.8px; line-height: 1.25; cursor: pointer; overflow-wrap: anywhere; }
.chip:disabled { cursor: default; }
.chip .num { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; border: 1.5px dashed var(--line); color: #fff; font-size: 12.5px; font-weight: 750; display: inline-flex; align-items: center; justify-content: center; }
.chip.in { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.chip.in .num { background: var(--accent); border: 0; }
.chip.ok { border-color: var(--green); background: var(--green-soft); }
.chip.ok .num { background: var(--green); }
.chip.bad { border-color: var(--red); background: var(--red-soft); }
.chip.bad .num { background: var(--red); }
.chip.dim { opacity: .5; }
.slots-foot { text-align: right; min-height: 30px; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 8px; }
.mbtn { min-height: 52px; padding: 8px 10px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; cursor: pointer; line-height: 1.25; overflow-wrap: anywhere; }
.mbtn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.mbtn.linked.p0 { background: #e4e1ff; border-color: #6d5ff0; } .mbtn.linked.p1 { background: #d9f3ef; border-color: #1a9d92; }
.mbtn.linked.p2 { background: #ffe8d6; border-color: #e0782c; } .mbtn.linked.p3 { background: #fbe0ee; border-color: #d0468a; }
@media (prefers-color-scheme: dark) {
  .mbtn.linked.p0 { background: #2a2760; } .mbtn.linked.p1 { background: #123b39; } .mbtn.linked.p2 { background: #47301b; } .mbtn.linked.p3 { background: #4a1e37; }
}
.mbtn.ok { border-color: var(--green) !important; background: var(--green-soft) !important; }
.mbtn.bad { border-color: var(--red) !important; background: var(--red-soft) !important; }
.mbtn:disabled { cursor: default; }

.nudge { color: var(--muted); font-size: 15px; margin: 4px 0 8px; }
.flash-zone { display: flex; flex-direction: column; gap: 10px; }
.back { background: var(--brand-soft); border-radius: 14px; padding: 12px 14px; }
.back-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); font-weight: 750; }
.back-text { font-size: 17px; font-weight: 650; margin-top: 2px; }
.back-note { font-size: 14px; color: var(--muted); }
.assess { margin-top: 12px; }
.assess-title { font-weight: 700; margin-bottom: 8px; }
.assess-btns, .conf-btns { display: flex; flex-direction: row; gap: 8px; }
.choice-lg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 8px 4px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 650; font-size: 14px; line-height: 1.2; text-align: center; }
.choice-lg .em { font-size: 20px; line-height: 1; }
.choice-lg:hover { border-color: var(--accent); }
.session { position: relative; overflow: hidden; }

<script>
/* ── engine/util.js ── */
/* engine/util.js — petits utilitaires partagés (aucune dépendance) */
(function (R) {
  'use strict';
  const U = {};

  U.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Mini-balisage : **gras**, ___ (trou), retours à la ligne.
  U.rich = (s) => U.esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/___/g, '<span class="blank"></span>').replace(/\n/g, '<br>');

  U.el = function (tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return e;
  };

  U.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // Comparaison de textes : minuscules, sans accents, sans ponctuation, espaces normalisés.
  U.clean = (s) => String(s).toLowerCase().replace(/[¿?¡!.,;:«»"“”]/g, '').replace(/\s+/g, ' ').trim();
  U.norm = (s) => U.clean(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

  // "20 %", "0,5", " 150 mL" -> nombre. Refuse s'il y a plusieurs nombres.
  U.parseNum = function (s) {
    const t = String(s).replace(/ /g, ' ').replace(/(\d)\s+(?=\d{3}\b)/g, '$1').replace(/,/g, '.');
    const m = t.match(/-?\d+(?:\.\d+)?/g);
    if (!m || m.length !== 1) return null;
    return parseFloat(m[0]);
  };

  U.firstSentence = function (s) {
    const m = String(s).match(/^.*?[.!?](?=\s|$)/);
    return m ? m[0] : s;
  };

  // Horloge remplaçable (tests / démonstration)
  R.clockFn = () => Date.now();
  U.now = () => R.clockFn();
  R.setClock = (fn) => { R.clockFn = fn; };

  U.dayKey = function (ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  };
  U.DAY = 86400000;

  U.pct = (x) => Math.round(x * 100);
  U.lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  U.uid = () => Math.random().toString(36).slice(2, 9);

  R.util = U;
})((window.R = window.R || {}));


/* ── data/registry.js ── */
/* data/registry.js — registre global du cours (multi-semaines).
 *
 * Organisation : /data/<niveau>/<semaine>/
 *   meta.js       -> R.data.subject / R.data.module / R.data.skill / R.data.week / R.data.placeholder
 *   <matiere>.js  -> R.data.addItems(weekKey, [...])
 *
 * Les compétences (skills) sont GLOBALES au cours, pas propres à une semaine : une compétence déjà
 * définie en semaine 3 et retravaillée en semaine 4 garde le MÊME identifiant (upsert, jamais dupliqué).
 * La banque d'activités (items) est un pool unique où chaque item porte juste `week` (pour savoir
 * quand il a été introduit) ; le moteur de sélection choisit librement dans tout le pool.
 *
 * Ajouter une semaine 5 = créer /data/seconde/semaine-05/, y appeler R.data.week({key, order, label}),
 * réutiliser les ids de compétences existants quand la notion continue, et lister les fichiers dans
 * build.js. Aucun autre changement n'est nécessaire : le moteur mélange automatiquement tout le pool.
 */
(function (R) {
  'use strict';
  const subjects = {}, modules = {}, skills = {}, weeks = {};
  const placeholders = [];
  let items = [];
  let built = null;

  R.data = {
    // upserts : appeler plusieurs fois avec le même id est sans danger (fusion, jamais de doublon)
    subject(o) { subjects[o.id] = Object.assign({}, subjects[o.id], o); built = null; },
    module(o) { modules[o.id] = Object.assign({}, modules[o.id], o); built = null; },
    skill(o) { skills[o.id] = Object.assign({}, skills[o.id], o); built = null; },
    week(o) { weeks[o.key] = Object.assign({ worked: [] }, weeks[o.key], o); built = null; },
    // note d'attente de contenu (ex. évaluation annoncée sans cours fourni) — jamais de question générée
    placeholder(o) { placeholders.push(o); built = null; },

    addItems(weekKey, arr) {
      arr.forEach((i) => items.push(Object.assign({ week: weekKey }, i)));
      built = null;
    },

    current() {
      if (built) return built;
      const weekList = Object.values(weeks).sort((a, b) => a.order - b.order);
      const currentWeek = weekList[weekList.length - 1] || null;

      // pour chaque compétence : semaines où elle a des items, semaine d'introduction (la plus ancienne)
      const bySkillWeeks = {};
      items.forEach((it) => { (bySkillWeeks[it.skill] = bySkillWeeks[it.skill] || new Set()).add(it.week); });
      const order = (wk) => (weeks[wk] ? weeks[wk].order : 0);
      Object.keys(skills).forEach((id) => {
        const ws = [...(bySkillWeeks[id] || [])].sort((a, b) => order(a) - order(b));
        skills[id].weeks = ws;
        skills[id].introducedWeek = ws[0] || null;
      });

      const idx = { item: {}, skill: skills, subject: subjects, module: modules, week: weeks };
      items.forEach((i) => (idx.item[i.id] = i));

      built = {
        key: 'seconde',
        subjects: Object.values(subjects), modules: Object.values(modules), skills: Object.values(skills),
        items, weeks, weekList, currentWeek, placeholders,
        _idx: idx,
      };
      return built;
    },
  };
})((window.R = window.R || {}));

/* storage/store.js — progression locale (localStorage, avec repli mémoire).
 * Aucun compte, aucun serveur, aucune donnée envoyée.
 *
 * La progression est désormais unique pour tout le cours (clé "revisions:<courseKey>", ex. "revisions:seconde"),
 * partagée entre toutes les semaines : une compétence gardant le même id d'une semaine à l'autre, son
 * historique de maîtrise continue naturellement. Si une ancienne clé par semaine existe encore
 * (ex. "revisions:seconde/semaine-03", du format précédent), elle est migrée automatiquement une fois. */
(function (R) {
  'use strict';
  const mem = {};
  let persistent = true;

  function lsGet(k) {
    try { return window.localStorage.getItem(k); } catch (e) { persistent = false; return mem[k] || null; }
  }
  function lsSet(k, v) {
    try { window.localStorage.setItem(k, v); } catch (e) { persistent = false; mem[k] = v; }
  }
  function lsDel(k) {
    try { window.localStorage.removeItem(k); } catch (e) { persistent = false; }
    delete mem[k];
  }
  function lsKeys() {
    try { return Object.keys(window.localStorage); } catch (e) { return Object.keys(mem); }
  }

  function blank() {
    return { v: 1, skills: {}, items: {}, history: {}, session: null, lastSummary: null, createdAt: R.util.now() };
  }

  // Ancien format : une clé par semaine ("revisions:seconde/semaine-03"). On fusionne tout ce qui existe
  // (le plus ancien d'abord, pour que les semaines plus récentes aient le dernier mot sur un même id).
  function migrateLegacy(courseKey) {
    const prefix = 'revisions:' + courseKey + '/';
    const legacyKeys = lsKeys().filter((k) => k.indexOf(prefix) === 0).sort();
    if (!legacyKeys.length) return null;
    const merged = blank();
    legacyKeys.forEach((k) => {
      let s;
      try { s = JSON.parse(lsGet(k)); } catch (e) { s = null; }
      if (!s || s.v !== 1) return;
      Object.assign(merged.skills, s.skills);
      Object.assign(merged.items, s.items);
      Object.keys(s.history || {}).forEach((day) => {
        const h = merged.history[day] || { count: 0, ok: 0 };
        h.count += s.history[day].count; h.ok += s.history[day].ok;
        merged.history[day] = h;
      });
      if (s.createdAt && (!merged.createdAt || s.createdAt < merged.createdAt)) merged.createdAt = s.createdAt;
    });
    legacyKeys.forEach((k) => lsDel(k));
    return merged;
  }

  R.store = {
    key: (courseKey) => 'revisions:' + courseKey,
    isPersistent() {
      try { window.localStorage.setItem('__t', '1'); window.localStorage.removeItem('__t'); } catch (e) { persistent = false; }
      return persistent;
    },
    load(courseKey) {
      const k = this.key(courseKey);
      const raw = lsGet(k);
      if (raw) {
        try {
          const s = JSON.parse(raw);
          if (s && s.v === 1) return Object.assign(blank(), s);
        } catch (e) { /* corrompu : on repart de zéro */ }
      }
      const migrated = migrateLegacy(courseKey);
      if (migrated) { this.save(courseKey, migrated); return migrated; }
      return blank();
    },
    save(courseKey, state) {
      lsSet(this.key(courseKey), JSON.stringify(state));
    },
    reset(courseKey) {
      lsDel(this.key(courseKey));
      return blank();
    },
  };
})((window.R = window.R || {}));


/* ── engine/mastery.js ── */
/* engine/mastery.js — état de maîtrise + répétition espacée légère.
 *
 * Résultat d'une réponse ("outcome") :
 *   fail  : erreur                                  -> 🔴 revient vite
 *   shaky : juste mais hésitant / deviné / indice   -> 🟠 revient à la prochaine session
 *   solid : juste et sûr(e), sans aide              -> espacement : +2 j, +4 j, +7 j
 *
 * Statut d'une microcompétence :
 *   new    : jamais vue
 *   red    : dernière réponse fausse
 *   orange : dernière réponse fragile, OU une seule récupération sûre
 *   green  : au moins deux récupérations sûres ESPACÉES (≥ ~1 jour d'écart)
 * Une seule bonne réponse ne suffit donc jamais à « acquérir » une notion.
 */
(function (R) {
  'use strict';
  const U = R.util;
  const DAY = U.DAY;
  const SPACING_MS = 18 * 3600 * 1000; // deux réussites comptent comme "espacées" à partir de 18 h d'écart
  const INTERVAL_DAYS = { 1: 2, 2: 4, 3: 7 };

  function blank() {
    return {
      attempts: 0, successes: 0, errors: 0,
      lastAttempt: null, lastConfidence: null, lastSuccessNoHelp: null,
      lastOutcome: null, streak: 0, streakAt: null, dueAt: null,
      everFailed: false, lastFailAt: null, overconfident: 0, guessed: 0,
    };
  }

  const M = {
    blank,

    status(st) {
      if (!st || !st.attempts) return 'new';
      if (st.lastOutcome === 'fail') return 'red';
      if (st.lastOutcome === 'shaky') return 'orange';
      return st.streak >= 2 ? 'green' : 'orange';
    },

    // Score 0..1 utilisé pour les pourcentages de progression
    score(st) {
      const s = M.status(st);
      if (s === 'new') return 0;
      if (s === 'red') return 0.1;
      if (s === 'orange') return st.lastOutcome === 'shaky' ? 0.3 : 0.5;
      return st.streak >= 3 ? 1 : 0.85;
    },

    isDue(st, now) {
      return !!(st && st.attempts && st.dueAt != null && st.dueAt <= now);
    },

    // Notions à ne pas laisser dormir : rouges / hésitantes / échues
    isWeak(st, now) {
      if (!st || !st.attempts) return false;
      const s = M.status(st);
      if (s === 'red') return true;
      if (st.lastOutcome === 'shaky') return true;
      if (st.everFailed && st.lastFailAt && now - st.lastFailAt < 7 * DAY && s !== 'red') return true; // échouée puis réussie récemment
      return false;
    },

    weakReason(st, now) {
      const s = M.status(st);
      if (s === 'red') return 'Échouée';
      if (st.lastOutcome === 'shaky') return st.lastConfidence === 'guess' ? 'Réussie au hasard' : 'Réussie avec hésitation';
      return 'Échouée puis réussie récemment';
    },

    record(state, skillId, itemId, outcome, extra, now) {
      extra = extra || {};
      const st = state.skills[skillId] || (state.skills[skillId] = blank());
      st.attempts++;
      st.lastAttempt = now;
      st.lastOutcome = outcome;
      if (extra.conf) st.lastConfidence = extra.conf;

      if (outcome === 'fail') {
        st.errors++;
        st.streak = 0; st.streakAt = null;
        st.everFailed = true; st.lastFailAt = now;
        st.dueAt = now;
        if (extra.conf === 'sure') st.overconfident++;
      } else {
        st.successes++;
        if (outcome === 'shaky') {
          if (extra.conf === 'guess') st.guessed++;
          st.streak = Math.max(0, st.streak - 1);
          if (st.streak === 0) st.streakAt = null;
          st.dueAt = now; // à la prochaine session
        } else {
          st.lastSuccessNoHelp = now;
          if (st.streak === 0 || st.streakAt == null || now - st.streakAt >= SPACING_MS) {
            st.streak++;
            st.streakAt = now;
          }
          const days = INTERVAL_DAYS[Math.min(st.streak, 3)];
          st.dueAt = Math.max(st.dueAt && st.dueAt > now ? st.dueAt : 0, now + days * DAY);
        }
      }

      // mémoire par item (pour varier les questions)
      const it = state.items[itemId] || (state.items[itemId] = { seen: 0, last: null, ok: 0 });
      it.seen++; it.last = now;
      if (outcome !== 'fail') it.ok++;

      // historique quotidien
      const dk = U.dayKey(now);
      const h = state.history[dk] || (state.history[dk] = { count: 0, ok: 0 });
      h.count++;
      if (outcome !== 'fail') h.ok++;
      return st;
    },

    // Série de jours consécutifs avec au moins une réactivation
    dayStreak(state, now) {
      let n = 0;
      let t = now;
      if (!state.history[U.dayKey(t)]) t -= DAY; // pas encore aujourd'hui : on regarde depuis hier
      while (state.history[U.dayKey(t)]) { n++; t -= DAY; }
      return n;
    },

    totalReactivations(state) {
      return Object.values(state.history).reduce((a, h) => a + h.count, 0);
    },

    dueLabel(st, now) {
      if (!st || !st.attempts) return 'Pas encore vu';
      if (st.dueAt == null || st.dueAt <= now) return 'À revoir maintenant';
      const d = Math.ceil((st.dueAt - now) / DAY);
      if (d <= 1) return 'À revoir demain';
      return 'À revoir dans ' + d + ' j';
    },

    // Agrégats
    summarize(week, state, now, filter) {
      const skills = week.skills.filter(filter || (() => true));
      const out = { green: 0, orange: 0, red: 0, new: 0, total: skills.length, progress: 0 };
      let sum = 0;
      skills.forEach((s) => {
        const st = state.skills[s.id];
        out[M.status(st)]++;
        sum += M.score(st);
      });
      out.progress = skills.length ? sum / skills.length : 0;
      return out;
    },

    // Statut agrégé d'un groupe de compétences (module)
    groupStatus(week, state, skillIds) {
      const sts = skillIds.map((id) => M.status(state.skills[id]));
      if (sts.every((s) => s === 'new')) return 'new';
      if (sts.includes('red')) return 'red';
      if (sts.every((s) => s === 'green')) return 'green';
      return 'orange';
    },
  };

  R.mastery = M;
})((window.R = window.R || {}));


/* ── engine/selector.js ── */
/* engine/selector.js — choix des questions.
 * Priorités (mode express) : 1) échouées  2) hésitantes  3) pas vues / échues  4) quelques réussies pour vérifier le maintien.
 * Entrelacement : on évite deux questions de suite de la même matière (ou de la même compétence dans un mode « une matière »).
 */
(function (R) {
  'use strict';
  const U = R.util;
  const M = R.mastery;

  const DEFAULT_WEIGHT = { mcq: 1, tf: 0.8, number: 1, text: 1, match: 1.5, order: 1.5, flashcard: 1, proof: 2.5, speaking: 3 };
  function weightOf(item) {
    if (item.weight != null) return item.weight;
    if (item.type === 'flashcard' && item.input) return 2;
    return DEFAULT_WEIGHT[item.type] || 1;
  }

  function priority(st, now) {
    const status = M.status(st);
    if (status === 'new') return { score: 60, reason: 'new' };
    if (status === 'red') return { score: 100 + Math.min(10, (now - (st.lastFailAt || now)) / U.DAY), reason: 'red' };
    if (st.lastOutcome === 'shaky') return { score: 80, reason: 'shaky' };
    if (M.isDue(st, now)) return { score: 55 + Math.min(10, (now - st.dueAt) / U.DAY), reason: 'due' };
    if (status === 'orange') return { score: 35, reason: 'orange' };
    return { score: 10, reason: 'maintain' };
  }

  function targetDifficulty(status) {
    return status === 'green' ? 3 : status === 'orange' ? 2 : 1;
  }

  const S = {
    weightOf,
    priority,

    skillInfos(week, state, now, skillFilter) {
      return week.skills.filter(skillFilter || (() => true)).map((skill) => {
        const st = state.skills[skill.id];
        const p = priority(st, now);
        return { skill, st, status: M.status(st), score: p.score, reason: p.reason };
      });
    },

    // Choisit l'item le moins vu / le plus adapté d'une compétence.
    pickItem(week, state, skillId, exclude, opts) {
      opts = opts || {};
      const st = state.skills[skillId];
      const target = targetDifficulty(M.status(st));
      let pool = week.items.filter((i) => i.skill === skillId && !exclude.has(i.id));
      if (opts.challenge) pool = pool.filter((i) => !i.noChallenge && i.type !== 'mcq' && i.type !== 'tf' && i.type !== 'proof');
      if (opts.maxWeight != null) pool = pool.filter((i) => weightOf(i) <= opts.maxWeight);
      if (!pool.length) return null;
      const key = (i) => {
        const it = state.items[i.id] || { seen: 0, last: 0 };
        return [it.seen, Math.abs((i.difficulty || 1) - target), it.last || 0, Math.random()];
      };
      pool.sort((a, b) => {
        const ka = key(a), kb = key(b);
        for (let n = 0; n < ka.length; n++) if (ka[n] !== kb[n]) return ka[n] - kb[n];
        return 0;
      });
      return pool[0];
    },

    // Entrelacement : jamais deux fois de suite la même clé (matière ou compétence) si c'est possible.
    // On privilégie la priorité pédagogique, mais aussi les clés les plus nombreuses pour ne pas se retrouver coincé.
    interleave(entries, keyFn) {
      const rest = entries.slice();
      const remaining = {};
      rest.forEach((e) => { const k = keyFn(e); remaining[k] = (remaining[k] || 0) + 1; });
      const out = [];
      while (rest.length) {
        const last = out.length ? keyFn(out[out.length - 1]) : null;
        const last2 = out.length > 1 ? keyFn(out[out.length - 2]) : null;
        let best = -1, bestScore = -Infinity;
        rest.forEach((e, i) => {
          const k = keyFn(e);
          if (k === last) return;
          const score = e.p + 25 * remaining[k] - (k === last2 ? 15 : 0);
          if (score > bestScore) { bestScore = score; best = i; }
        });
        if (best < 0) best = 0; // plus le choix : même clé que la précédente
        const e = rest.splice(best, 1)[0];
        remaining[keyFn(e)]--;
        out.push(e);
      }
      return out;
    },

    askConfidence(item, challenge) {
      if (item.type === 'mcq' || item.type === 'tf') return challenge ? true : Math.random() < 0.6;
      if (item.type === 'number' || item.type === 'text') return challenge ? true : Math.random() < 0.35;
      return false;
    },

    makeEntry(item, extra) {
      return Object.assign({ itemId: item.id, skillId: item.skill, subject: item.subject, ask: false, retry: false }, extra || {});
    },

    /**
     * opts: { mode, n, subject?, skillIds?, challenge?, budget? }
     */
    build(week, state, opts) {
      const now = U.now();
      const n = opts.n || 10;
      const budget = opts.budget || Math.round(n * 1.5);
      const focused = !!(opts.subject || opts.skillIds);
      const filter = (s) => (opts.skillIds ? opts.skillIds.indexOf(s.id) >= 0 : opts.subject ? s.subject === opts.subject : true);
      const infos = S.skillInfos(week, state, now, filter);
      infos.forEach((o) => { o.p = o.score + Math.random() * 8; });
      infos.sort((a, b) => b.p - a.p);

      const used = new Set();
      const cnt = {}, subj = {};
      const picks = [];
      let weight = 0;
      let cap = focused ? Infinity : Math.max(2, Math.ceil(n * 0.3));

      const tryAdd = (o, force) => {
        const w0 = weight;
        const item = S.pickItem(week, state, o.skill.id, used, { challenge: opts.challenge, maxWeight: force ? null : Math.max(1, budget - w0) });
        if (!item) return false;
        if (picks.length && weight + weightOf(item) > budget + 0.01 && !force) return false;
        used.add(item.id);
        cnt[o.skill.id] = (cnt[o.skill.id] || 0) + 1;
        subj[o.skill.subject] = (subj[o.skill.subject] || 0) + 1;
        weight += weightOf(item);
        picks.push({ item, p: o.p, skillId: o.skill.id, subject: o.skill.subject, reason: o.reason });
        return true;
      };

      // 4) maintien : quelques notions déjà solides (mode express uniquement)
      if (opts.mode === 'express') {
        const greens = infos.filter((o) => o.status === 'green');
        const others = infos.length - greens.length;
        const keep = Math.min(greens.length, n >= 10 ? 2 : 1, Math.max(0, infos.length - others > 0 ? 2 : 0));
        if (greens.length && others >= n - keep) {
          const dueFirst = greens.slice().sort((a, b) => (M.isDue(b.st, now) - M.isDue(a.st, now)) || (Math.random() - 0.5));
          dueFirst.slice(0, keep).forEach((o) => tryAdd(o));
        }
      }

      for (let round = 1; round <= 5 && picks.length < n; round++) {
        for (const o of infos) {
          if (picks.length >= n) break;
          if ((cnt[o.skill.id] || 0) >= round) continue;
          if (opts.mode === 'express' && o.status === 'green' && round === 1 && picks.some((p) => p.skillId === o.skill.id)) continue;
          if ((subj[o.skill.subject] || 0) >= cap) continue;
          tryAdd(o);
        }
        if (round === 1) cap = Infinity;
      }
      if (!picks.length) {
        // dernier recours : ignorer le budget de temps
        for (const o of infos) { if (picks.length >= n) break; tryAdd(o, true); }
      }

      const keyFn = focused ? (e) => e.skillId : (e) => e.subject;
      const ordered = S.interleave(picks, keyFn);
      const curWeek = week.currentWeek ? week.currentWeek.key : null;
      return ordered.map((p) => S.makeEntry(p.item, {
        ask: S.askConfidence(p.item, opts.challenge), reason: p.reason,
        badge: S.badgeFor(week._idx.skill[p.skillId], curWeek, p.reason),
      }));
    },

    // Une indication discrète, jamais systématique (voir <ui_evolution> du brief) :
    //  - « nouveau » seulement pour une compétence introduite cette semaine, sur sa première sélection ;
    //  - « réactivation » seulement quand la raison de sélection est une vraie réactivation
    //    (erreur, hésitation, échéance de répétition espacée) d'une compétence des semaines précédentes.
    badgeFor(skill, currentWeekKey, reason) {
      if (!skill || !currentWeekKey) return null;
      if (skill.introducedWeek === currentWeekKey && reason === 'new') return 'new';
      if (skill.introducedWeek !== currentWeekKey && (reason === 'red' || reason === 'shaky' || reason === 'due')) return 'reactivation';
      return null;
    },
  };

  R.selector = S;
})((window.R = window.R || {}));


/* ── engine/session.js ── */
/* engine/session.js — vie d'une session : création, enregistrement des réponses,
 * réapparition des erreurs, résumé de fin. Tout est sérialisable (session reprenable). */
(function (R) {
  'use strict';
  const U = R.util;
  const M = R.mastery;
  const S = R.selector;

  const MODES = {
    express: { n: 10, title: 'Réactivation du jour' },
    subject: { n: 10, title: 'Réviser une matière' },
    weak: { n: 10, title: 'Mes points faibles' },
    challenge: { n: 8, title: 'Défi mémoire', challenge: true },
    skill: { n: 6, title: 'Micro-session ciblée' },
    errors: { n: 8, title: 'Réactiver mes erreurs' },
  };

  const SES = {
    MODES,

    create(week, state, mode, opts) {
      opts = opts || {};
      const def = MODES[mode] || MODES.express;
      const queue = S.build(week, state, Object.assign({ mode, n: def.n, challenge: !!def.challenge }, opts));
      if (!queue.length) return null;
      return {
        id: U.uid(), mode, title: opts.title || def.title, challenge: !!def.challenge,
        queue, pos: 0, answered: [], retries: {}, shakyRetries: {},
        startedAt: U.now(), opts: { subject: opts.subject || null, skillIds: opts.skillIds || null },
      };
    },

    outcomeOf(res, conf, hintUsed, whyWrong) {
      if (!res.correct) return 'fail';
      if (res.partial || hintUsed || conf === 'guess' || conf === 'unsure' || whyWrong) return 'shaky';
      return 'solid';
    },

    // Enregistre une réponse et programme les réapparitions dans la session.
    answer(week, state, sess, data) {
      const now = U.now();
      const entry = sess.queue[sess.pos];
      const item = week._idx.item[entry.itemId];
      const st = M.record(state, entry.skillId, entry.itemId, data.outcome, { conf: data.conf }, now);
      sess.answered.push({ itemId: entry.itemId, skillId: entry.skillId, outcome: data.outcome, conf: data.conf || null, hint: !!data.hint, retry: !!entry.retry });

      // Réapparition : erreur -> dans ~3 questions ; hésitation -> dans ~6 questions (une fois)
      const sk = entry.skillId;
      const noRepeat = item.type === 'speaking'; // trop long : reprogrammé pour la prochaine session (dueAt = maintenant)
      if (!noRepeat && data.outcome === 'fail' && (sess.retries[sk] || 0) < 2) {
        const seen = new Set(sess.answered.map((a) => a.itemId));
        sess.queue.forEach((e) => seen.add(e.itemId)); // évite de reprendre une question déjà prévue
        let alt = S.pickItem(week, state, sk, seen, { challenge: sess.challenge });
        if (!alt) alt = S.pickItem(week, state, sk, new Set([entry.itemId]), { challenge: sess.challenge });
        if (alt) {
          sess.retries[sk] = (sess.retries[sk] || 0) + 1;
          const at = Math.min(sess.queue.length, sess.pos + 1 + 3);
          sess.queue.splice(at, 0, S.makeEntry(alt, { ask: S.askConfidence(alt, sess.challenge), retry: true }));
        }
      } else if (!noRepeat && data.outcome === 'shaky' && !entry.retry && (sess.shakyRetries[sk] || 0) < 1 && !sess.challenge) {
        const seen = new Set(sess.answered.map((a) => a.itemId));
        sess.queue.forEach((e) => seen.add(e.itemId));
        const alt = S.pickItem(week, state, sk, seen, {});
        if (alt) {
          sess.shakyRetries[sk] = 1;
          const at = Math.min(sess.queue.length, sess.pos + 1 + 6);
          sess.queue.splice(at, 0, S.makeEntry(alt, { ask: S.askConfidence(alt, false), retry: true }));
        }
      }
      return st;
    },

    // Résumé de fin de session (par notion)
    summarize(week, state, sess) {
      const bySkill = {};
      sess.answered.forEach((a) => {
        const r = bySkill[a.skillId] || (bySkill[a.skillId] = { skillId: a.skillId, outcomes: [] });
        r.outcomes.push(a.outcome);
      });
      const skills = Object.values(bySkill).map((r) => {
        const last = r.outcomes[r.outcomes.length - 1];
        let res;
        if (last === 'fail') res = 'red';
        else if (r.outcomes.some((o) => o !== 'solid')) res = 'orange';
        else res = 'green';
        return { skillId: r.skillId, result: res };
      });
      const count = (k) => skills.filter((s) => s.result === k).length;
      const now = U.now();
      const priority = skills
        .filter((s) => s.result !== 'green')
        .sort((a, b) => (a.result === 'red' ? 0 : 1) - (b.result === 'red' ? 0 : 1))
        .map((s) => s.skillId);
      const dues = week.skills.map((s) => state.skills[s.id]).filter((st) => st && st.attempts && st.dueAt != null).map((st) => st.dueAt);
      const nextDue = dues.length ? Math.min.apply(null, dues) : null;
      return {
        title: sess.title,
        questions: sess.answered.length,
        notions: skills.length,
        green: count('green'), orange: count('orange'), red: count('red'),
        priority: priority.slice(0, 4),
        errorSkillIds: skills.filter((s) => s.result !== 'green').map((s) => s.skillId),
        nextDue, at: now,
      };
    },
  };

  R.session = SES;
})((window.R = window.R || {}));


/* ── components/common.js ── */
/* components/common.js — helpers d'interface partagés + registre des composants de questions.
 *
 * Contrat d'un composant de question :
 *   Comp.mount(host, item, ctl) -> { reveal(result), destroy(), auto(wantCorrect) }
 *   ctl.submit({ correct, partial?, mistakes?, answerText?, correctText?, feedback?, note?, noConfidence? })
 *   ctl.selfAssess('easy'|'hesitant'|'hard')       (cartes auto-évaluées)
 *   ctl.setAction(label, fn, disabled) / ctl.clearAction()
 *   ctl.challenge (bool)
 */
(function (R) {
  'use strict';
  const { el, rich } = R.util;

  R.components = { byType: {} };

  R.ui = {
    STATUS: {
      new: { icon: '⚪', label: 'À découvrir' },
      green: { icon: '🟢', label: 'Acquis' },
      orange: { icon: '🟠', label: 'À consolider' },
      red: { icon: '🔴', label: 'À réactiver' },
    },
    dot(status) { return R.ui.STATUS[status].icon; },

    bar(value, color) {
      const b = el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.max(0, Math.min(100, value)) + '%;' + (color ? 'background:' + color : '') }));
      return b;
    },

    // Fenêtre de confirmation (Promise<boolean>)
    confirm(opts) {
      return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        const done = (v) => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = (e) => { if (e.key === 'Escape') done(false); };
        const ok = el('button', { class: 'btn ' + (opts.danger ? 'danger' : 'primary'), type: 'button', onclick: () => done(true) }, opts.ok || 'OK');
        const cancel = el('button', { class: 'btn ghost', type: 'button', onclick: () => done(false) }, opts.cancel || 'Annuler');
        const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title },
          el('h2', null, opts.title), opts.text ? el('p', null, opts.text) : null,
          el('div', { class: 'modal-actions' }, cancel, ok));

/* ── components/MCQQuestion.js ── */
/* MCQQuestion + TrueFalseQuestion */
(function (R) {
  'use strict';
  const { el, rich, shuffle } = R.util;

  // Les réponses sont mélangées à l'affichage (sauf shuffle:false) pour éviter de mémoriser une position.
  function mountChoices(host, item, ctl, opts) {
    const answers = opts.answers;
    const order = answers.map((_, i) => i);
    if (opts.shuffle !== false) order.splice(0, order.length, ...shuffle(order));
    let locked = false, picked = null;

    if (item.figure) host.append(R.ui.figure(item.figure));
    host.append(R.ui.promptEl(item.prompt, opts.promptClass));
    const box = el('div', { class: 'choices' + (opts.cols ? ' cols' + opts.cols : '') });
    const btns = {};
    order.forEach((ai, pos) => {
      const b = el('button', { class: 'choice', type: 'button', 'data-i': ai, onclick: () => pick(ai) },
        el('span', { class: 'k' }, opts.keyLabels ? opts.keyLabels[pos] : String(pos + 1)),
        el('span', { class: 't', html: rich(answers[ai]) }));
      btns[ai] = b; box.append(b);
    });
    host.append(box);

    function pick(ai) {
      if (locked) return;
      locked = true; picked = ai;
      btns[ai].classList.add('picked');
      Object.values(btns).forEach((b) => (b.disabled = true));
      ctl.submit(opts.evaluate(ai));
    }

    const off = R.ui.keys((e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (document.activeElement || {}).tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      let pos = -1;
      if (opts.keyMap) { pos = opts.keyMap(e.key.toLowerCase(), order); }
      else if (/^[1-9]$/.test(e.key)) pos = order[parseInt(e.key, 10) - 1];
      if (pos != null && pos >= 0 && btns[pos] && !locked) pick(pos);
    });

    return {
      reveal(res) {
        Object.keys(btns).forEach((k) => {
          const b = btns[k];
          b.disabled = true;
          const idx = Number(k);
          if (idx === opts.correctIdx) b.classList.add('correct');
          else if (idx === picked) b.classList.add('wrong');
          else b.classList.add('dim');
        });
      },
      destroy() { off(); },
      // idx (optionnel) : force une réponse précise (ex. pour tester chaque feedback dédié en dev/overflow).
      auto(wantCorrect, idx) {
        if (idx != null) { pick(idx); return; }
        const wrong = order.find((i) => i !== opts.correctIdx);
        pick(wantCorrect ? opts.correctIdx : wrong);
      },
    };
  }

  R.components.register('MCQQuestion', 'mcq', {
    mount(host, item, ctl) {
      return mountChoices(host, item, ctl, {
        answers: item.answers, shuffle: item.shuffle, correctIdx: item.correct,
        evaluate: (ai) => ({
          correct: ai === item.correct,
          answerText: item.answers[ai], correctText: item.answers[item.correct],
          feedback: item.feedbacks && item.feedbacks[ai],
        }),
      });
    },
  });

  // Vrai / Faux : l'énoncé est présenté comme une citation
  R.components.register('TrueFalseQuestion', 'tf', {
    mount(host, item, ctl) {
      const inst = mountChoices(host, Object.assign({}, item, { prompt: item.prompt }), ctl, {
        answers: ['Vrai', 'Faux'], shuffle: false, cols: 2, promptClass: 'statement', keyLabels: ['V', 'F'],
        keyMap: (k) => (k === 'v' || k === '1' ? 0 : k === 'f' || k === '2' ? 1 : -1),
        correctIdx: item.correct ? 0 : 1,
        evaluate: (ai) => ({
          correct: (ai === 0) === item.correct,
          answerText: ai === 0 ? 'Vrai' : 'Faux', correctText: item.correct ? 'Vrai' : 'Faux',
        }),
      });
      host.insertBefore(el('div', { class: 'kicker' }, 'Vrai ou faux ?'), host.firstChild);
      return inst;
    },
  });
})((window.R = window.R || {}));


/* ── components/NumberInputQuestion.js ── */
/* NumberInputQuestion + TextInputQuestion */
(function (R) {
  'use strict';
  const { el, parseNum, clean, norm } = R.util;

  function fieldRow(item, ctl, cfg) {
    const input = el('input', {
      class: 'field', type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
      inputmode: cfg.inputmode, enterkeyhint: 'done', placeholder: item.placeholder || cfg.placeholder || '', 'aria-label': 'Ta réponse',
    });
    if (cfg.lang) input.setAttribute('lang', cfg.lang);
    const err = el('div', { class: 'field-err', role: 'alert' });
    const row = el('div', { class: 'answer-row' }, input, item.unit ? el('span', { class: 'unit' }, item.unit) : null);
    return { input, err, row };
  }

  function mountField(host, item, ctl, cfg) {
    host.append(R.ui.promptEl(item.prompt));
    const { input, err, row } = fieldRow(item, ctl, cfg);
    host.append(row, err);
    let locked = false;

    function update() { ctl.setAction('Valider', submit, !input.value.trim()); }
    function submit() {
      if (locked || !input.value.trim()) return;
      const r = cfg.evaluate(input.value);
      if (r.invalid) { err.textContent = r.invalid; return; }
      err.textContent = '';
      locked = true; input.readOnly = true;
      ctl.submit(r);
    }
    input.addEventListener('input', () => { err.textContent = ''; update(); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    update();
    setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 60);

    return {
      reveal(res) { input.classList.add(res.correct ? 'ok' : 'bad'); },
      destroy() {},
      auto(wantCorrect) { input.value = wantCorrect ? cfg.sample : cfg.wrongSample; input.dispatchEvent(new Event('input')); submit(); },
    };
  }

  R.components.register('NumberInputQuestion', 'number', {
    mount(host, item, ctl) {
      const answers = item.answers || [item.answer];
      const tol = item.tolerance || 0;
      const fmt = (n) => String(n).replace('.', ',') + (item.unit ? ' ' + item.unit : '');
      return mountField(host, item, ctl, {
        inputmode: 'decimal', placeholder: 'Ta réponse',
        sample: String(answers[0]), wrongSample: String(answers[0] + 7),
        evaluate(txt) {
          const n = parseNum(txt);
          if (n === null) return { invalid: 'Écris un seul nombre (par exemple 12 ou 0,5).' };
          const ok = answers.some((a) => Math.abs(a - n) <= tol + 1e-9);
          return { correct: ok, answerText: fmt(n), correctText: answers.length > 1 ? 'par exemple ' + fmt(answers[0]) : fmt(answers[0]) };
        },
      });
    },
  });

  R.components.register('TextInputQuestion', 'text', {
    mount(host, item, ctl) {
      const accepts = item.accept;
      return mountField(host, item, ctl, {
        inputmode: 'text', lang: item.subject === 'espagnol' ? 'es' : 'fr', placeholder: 'Ta réponse',
        sample: accepts[0], wrongSample: 'zzz',
        evaluate(txt) {
          const exact = accepts.some((a) => clean(a) === clean(txt));
          const loose = accepts.some((a) => norm(a) === norm(txt));
          const res = { correct: exact || loose, answerText: txt.trim(), correctText: accepts[0] };
          if (!exact && loose) res.note = 'Attention aux accents : écris « ' + accepts[0] + ' ».';
          return res;
        },
      });
    },
  });
})((window.R = window.R || {}));


/* ── components/OrderQuestion.js ── */
/* OrderQuestion — touche les éléments dans l'ordre : chaque élément choisi reçoit son numéro sur place
 * (une seule liste = peu de hauteur). Les leurres, s'il y en a, ne doivent pas être choisis. */
(function (R) {
  'use strict';
  const { el, rich, shuffle } = R.util;

  R.components.register('OrderQuestion', 'order', {
    mount(host, item, ctl) {
      const target = item.items;
      const all = target.concat(item.distractors || []);
      const chips = shuffle(all.map((t, i) => ({ id: i, text: t })));
      let seq = []; // ids choisis, dans l'ordre
      let locked = false;

      const pool = el('div', { class: 'pool', role: 'group', 'aria-label': 'Éléments à ordonner' });
      const clear = el('button', { class: 'linkbtn', type: 'button', onclick: () => { if (!locked) { seq = []; render(); } } }, 'Effacer');
      host.append(el('div', { class: 'order-head' }, R.ui.promptEl(item.prompt, 'small'), clear), pool);

      const textOf = (id) => all[id];
      const eq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
      const orderCorrect = () => {
        const t = seq.map(textOf);
        if (eq(t, target)) return true;
        return (item.altOrders || []).some((perm) => eq(t, perm.map((i) => target[i])));
      };

      function toggle(id) {
        if (locked) return;
        const at = seq.indexOf(id);
        if (at >= 0) seq.splice(at, 1); else seq.push(id);
        render();
      }

      function render() {
        pool.innerHTML = '';
        chips.forEach((c) => {
          const at = seq.indexOf(c.id);
          pool.append(el('button', { class: 'chip' + (at >= 0 ? ' in' : ''), type: 'button', 'data-id': c.id, disabled: locked, 'aria-pressed': String(at >= 0), onclick: () => toggle(c.id) },
            el('span', { class: 'num' }, at >= 0 ? String(at + 1) : ''), el('span', { class: 'tx', html: rich(c.text) })));
        });
        clear.style.visibility = seq.length && !locked ? 'visible' : 'hidden';
        ctl.setAction('Valider', validate, seq.length !== target.length);
      }

      function validate() {
        if (locked || seq.length !== target.length) return;
        locked = true;
        const ok = orderCorrect();
        const t = seq.map(textOf);
        let mistakes = 0;
        t.forEach((x, i) => { if (x !== target[i]) mistakes++; });
        ctl.submit({ correct: ok, mistakes: ok ? 0 : mistakes, noConfidence: true, answerText: t.join(' / '), correctList: target });
      }

      render();
      return {
        reveal(res) {
          [...pool.children].forEach((b) => {
            b.disabled = true;
            const id = +b.dataset.id, at = seq.indexOf(id);
            if (at < 0) { b.classList.add('dim'); return; }
            b.classList.add(res.correct || textOf(id) === target[at] ? 'ok' : 'bad');
          });
          clear.style.visibility = 'hidden';
        },
        destroy() {},
        auto(wantCorrect) {
          const ids = target.map((t) => all.indexOf(t));
          seq = wantCorrect ? ids : ids.slice().reverse();
          render(); validate();
        },
      };
    },
  });
})((window.R = window.R || {}));


/* ── components/MatchQuestion.js ── */
/* MatchQuestion — touche un élément à gauche, puis son correspondant à droite. */
(function (R) {
  'use strict';
  const { el, rich, shuffle } = R.util;

  R.components.register('MatchQuestion', 'match', {
    mount(host, item, ctl) {
      const pairs = item.pairs;
      const rights = shuffle(pairs.map((p, i) => ({ text: p[1], orig: i })));
      const link = {}; // gauche -> index dans rights
      let sel = null, locked = false;

      host.append(R.ui.promptEl(item.prompt, 'small'));
      const cols = el('div', { class: 'match' });
      const L = el('div', { class: 'match-col' }), Rr = el('div', { class: 'match-col' });
      cols.append(L, Rr);
      host.append(cols);

      const rightOwner = (ri) => Object.keys(link).find((l) => link[l] === ri);

      function render() {
        L.innerHTML = ''; Rr.innerHTML = '';
        pairs.forEach((p, li) => {
          const has = link[li] != null;
          L.append(el('button', { type: 'button', disabled: locked, class: 'mbtn' + (has ? ' linked p' + li : '') + (sel === li ? ' sel' : ''), onclick: () => clickL(li), html: rich(p[0]) }));
        });
        rights.forEach((r, ri) => {
          const owner = rightOwner(ri);
          Rr.append(el('button', { type: 'button', disabled: locked, class: 'mbtn' + (owner != null ? ' linked p' + owner : ''), onclick: () => clickR(ri), html: rich(r.text) }));
        });
        ctl.setAction('Valider', validate, Object.keys(link).length !== pairs.length);
      }
      function clickL(li) {
        if (locked) return;
        if (link[li] != null) { delete link[li]; sel = li; }
        else sel = sel === li ? null : li;
        render();
      }
      function clickR(ri) {
        if (locked) return;
        const owner = rightOwner(ri);
        if (sel == null) { if (owner != null) { delete link[owner]; render(); } return; }
        if (owner != null) delete link[owner];
        link[sel] = ri; sel = null;
        render();
      }
      function validate() {
        if (locked || Object.keys(link).length !== pairs.length) return;
        locked = true;
        let mistakes = 0;
        pairs.forEach((p, li) => { if (rights[link[li]].orig !== li) mistakes++; });
        ctl.submit({ correct: mistakes === 0, partial: false, mistakes, noConfidence: true, answerText: '', correctList: pairs.map((p) => p[0] + '  =  ' + p[1]) });
      }
      render();

      return {
        reveal() {
          [...L.children].forEach((b, li) => { b.disabled = true; b.classList.add(rights[link[li]].orig === li ? 'ok' : 'bad'); });
          [...Rr.children].forEach((b, ri) => { b.disabled = true; const o = rightOwner(ri); b.classList.add(o != null && rights[ri].orig === Number(o) ? 'ok' : 'bad'); });
        },
        destroy() {},
        auto(wantCorrect) {
          pairs.forEach((p, li) => {
            let ri = rights.findIndex((r) => r.orig === li);
            if (!wantCorrect) ri = rights.findIndex((r) => r.orig === (li + 1) % pairs.length);
            link[li] = ri;
          });
          render(); validate();
        },
      };
    },
  });
})((window.R = window.R || {}));

/* ── components/SpeakingCard.js ── */
/* SpeakingCard — cartes d'expression orale (30 s), sans enregistrement.
 *   mode "think" (A01) : 30 s pour construire mentalement -> aide (structures) -> auto-évaluation
 *   mode "speak" (A03) : 30 s à voix haute -> auto-évaluation
 * Un seul chrono actif à la fois (nettoyé à chaque changement d'étape). */
(function (R) {
  'use strict';
  const { el, rich } = R.util;
  const SECONDS = 30;

  R.components.register('SpeakingCard', 'speaking', {
    mount(host, item, ctl) {
      const think = item.mode === 'think';
      const seconds = item.seconds || SECONDS;
      let timerId = null, assess = null, stage = 0;
      const stop = () => { if (timerId) { clearInterval(timerId); timerId = null; } };

      const head = el('div', { class: 'speak-head' }, think ? '💭 EXPRESSION RAPIDE' : '🎙️ SPEAK FOR 30 SECONDS');
      host.append(head, R.ui.promptEl(item.prompt, 'card en'));
      const zone = el('div', { class: 'speak-zone' });
      host.append(zone);

      function intro() {
        stage = 0; zone.innerHTML = '';
        zone.append(el('div', { class: 'nudge' }, think ? 'Tu as 30 secondes pour construire ta réponse dans ta tête.' : 'Parle 30 secondes, à voix haute. Pas besoin d’enregistrer.'));
        ctl.setAction('▶ Démarrer les 30 secondes', start, false);
      }

      function start() {
        stage = 1; stop(); zone.innerHTML = '';
        const R_ = 46, C = 2 * Math.PI * R_;
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '0 0 110 110'); svg.setAttribute('class', 'ring'); svg.setAttribute('aria-hidden', 'true');
        const bg = document.createElementNS(svgNS, 'circle');
        ['cx', 'cy'].forEach((a) => bg.setAttribute(a, 55)); bg.setAttribute('r', R_); bg.setAttribute('class', 'ring-bg');
        const fg = document.createElementNS(svgNS, 'circle');
        ['cx', 'cy'].forEach((a) => fg.setAttribute(a, 55)); fg.setAttribute('r', R_); fg.setAttribute('class', 'ring-fg');
        fg.setAttribute('stroke-dasharray', C); fg.setAttribute('stroke-dashoffset', 0);
        fg.setAttribute('transform', 'rotate(-90 55 55)');
        svg.append(bg, fg);
        const num = el('div', { class: 'ring-num', 'aria-live': 'off' }, String(seconds));
        zone.append(el('div', { class: 'ring-wrap' }, svg, num));
        const end = R.util.now() + seconds * 1000;
        const tick = () => {
          const left = Math.max(0, end - R.util.now());
          num.textContent = String(Math.ceil(left / 1000));
          fg.setAttribute('stroke-dashoffset', String(C * (1 - left / (seconds * 1000))));
          if (left <= 0) finishTimer();
        };
        timerId = setInterval(tick, 200);
        tick();
        ctl.setAction('Passer le chrono', finishTimer, false);
      }

      function finishTimer() {
        stop();
        if (think && !ctl.challenge) helpStage(); else assessStage();
      }

      function helpStage() {
        stage = 2; zone.innerHTML = '';
        zone.append(el('div', { class: 'help-box' }, el('div', { class: 'help-title' }, 'Pour t’aider, quelques structures :'),
          el('ul', null, (item.help || []).map((h) => el('li', { html: rich(h) })))));
        zone.append(el('div', { class: 'nudge' }, 'Dis maintenant ta réponse à voix haute, en t’appuyant (ou pas) sur ces débuts de phrases.'));
        ctl.setAction('J’ai formulé ma réponse', assessStage, false);
      }

      function assessStage() {
        stop(); stage = 3; zone.innerHTML = '';
        ctl.clearAction();
        if (item.explanation) zone.append(el('div', { class: 'back-note', html: rich(item.explanation) }));
        assess = R.components.SelfAssessment.mount(host, { set: 'speak', title: 'Comment ça s’est passé ?' }, (lv) => ctl.selfAssess(lv));
        const a = host.querySelector('.assess');
        if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
      }

      intro();
      return {
        reveal() {},
        destroy() { stop(); if (assess) assess.destroy(); },
        auto(wantCorrect) { finishTimer(); if (stage !== 3) assessStage(); assess.auto(wantCorrect ? 'easy' : 'hard'); },
        _stage: () => stage,
        _skipTo: (s) => { if (s === 1) start(); else if (s === 2) helpStage(); else if (s === 3) assessStage(); },

/* ── components/GuidedProof.js ── */
/* GuidedProof — démonstration en micro-étapes. À chaque étape, un choix ; la ligne du raisonnement s'affiche
 * quand l'étape est réussie. Le nombre d'erreurs décide du résultat (0 : solide, 1 : hésitant, 2+ : à refaire). */
(function (R) {
  'use strict';
  const { el, rich, shuffle } = R.util;

  R.components.register('GuidedProof', 'proof', {
    mount(host, item, ctl) {
      const steps = item.steps;
      let si = 0, mistakes = 0, locked = false, tid = null, finished = false;

      host.append(el('div', { class: 'proof-goal' }, el('span', { class: 'tag' }, 'À démontrer'), el('div', { html: rich(item.prompt) })));
      const lines = el('ol', { class: 'proof-lines', 'aria-label': 'Raisonnement construit' });
      const stepBox = el('div', { class: 'proof-step' });
      host.append(lines, stepBox);

      function showStep() {
        locked = false;
        stepBox.innerHTML = '';
        const s = steps[si];
        const order = shuffle(s.answers.map((_, i) => i));
        stepBox.append(el('div', { class: 'proof-q' }, el('span', { class: 'proof-n' }, (si + 1) + '/' + steps.length), el('span', { html: rich(s.q) })));
        const box = el('div', { class: 'choices' });
        const fb = el('div', { class: 'proof-fb', role: 'status' });
        order.forEach((ai, pos) => {
          const b = el('button', { class: 'choice', type: 'button', onclick: () => choose(ai, b, fb) },
            el('span', { class: 'k' }, String(pos + 1)), el('span', { class: 't', html: rich(s.answers[ai]) }));
          b.dataset.i = ai;
          box.append(b);
        });
        stepBox.append(box, fb);
        ctl.clearAction();
      }

      function choose(ai, btn, fb) {
        if (locked) return;
        const s = steps[si];
        if (ai !== s.correct) {
          mistakes++;
          btn.classList.add('wrong'); btn.disabled = true;
          fb.textContent = (s.feedbacks && s.feedbacks[ai]) || 'Pas encore : relis l’étape.';
          return;
        }
        locked = true;
        btn.classList.add('correct');
        stepBox.querySelectorAll('.choice').forEach((b) => (b.disabled = true));
        fb.textContent = '';
        lines.append(el('li', { class: 'line', html: rich(s.line) }));
        tid = setTimeout(() => {
          si++;
          if (si < steps.length) showStep(); else finish();
        }, 550);
      }

      function finish() {
        finished = true;
        stepBox.innerHTML = '';
        stepBox.append(el('div', { class: 'proof-done' }, '✓ Démonstration terminée'));
        ctl.submit({ correct: mistakes < 2, partial: mistakes === 1, mistakes, noConfidence: true, answerText: '', correctText: '' });
      }

      const off = R.ui.keys((e) => {
        if (!/^[1-9]$/.test(e.key) || locked || finished || e.ctrlKey || e.metaKey) return;
        const b = stepBox.querySelectorAll('.choice:not([disabled])')[+e.key - 1];
        if (b) b.click();
      });

      showStep();
      return {
        reveal() {},
        destroy() { off(); if (tid) clearTimeout(tid); },
        auto(wantCorrect) {
          const run = () => {
            if (finished) return;
            const s = steps[si];
            if (!wantCorrect && si < 2) {
              const wrong = [...stepBox.querySelectorAll('.choice')].find((b) => +b.dataset.i !== s.correct);
              if (wrong) wrong.click();
            }
            const good = [...stepBox.querySelectorAll('.choice')].find((b) => +b.dataset.i === s.correct);
            if (good) good.click();
          };
          const loop = setInterval(() => { if (finished) clearInterval(loop); else if (!locked) run(); }, 40);
        },
      };
    },
  });
})((window.R = window.R || {}));

/* views/router.js — routeur minimal par hash + état applicatif. */
(function (R) {
  'use strict';
  const { el } = R.util;
  R.views = {};

  const app = {
    week: null, state: null,
    init() {
      app.week = R.data.current();
      app.state = R.store.load(app.week.key);
      app.persistent = R.store.isPersistent();
    },
    save() { R.store.save(app.week.key, app.state); },
    reload() { app.state = R.store.load(app.week.key); },

    // Lance une session (demande confirmation si une session est déjà en pause)
    async startSession(mode, opts) {
      if (app.state.session && !(opts && opts.replace)) {
        const ok = await R.ui.confirm({ title: 'Remplacer la session en cours ?', text: 'Ta session en pause sera abandonnée (tes réponses déjà données restent comptées).', ok: 'Nouvelle session', cancel: 'Annuler' });
        if (!ok) return false;
      }
      const sess = R.session.create(app.week, app.state, mode, opts);
      if (!sess) return false;
      app.state.session = sess;
      app.save();
      location.hash = '#/session';
      return true;
    },

    async resetAll() {
      const ok = await R.ui.confirm({
        title: 'Réinitialiser ma progression ?',
        text: 'Toute ta progression (notions, historique, série) sera effacée sur cet appareil. Cette action est définitive.',
        ok: 'Tout effacer', cancel: 'Annuler', danger: true,
      });
      if (!ok) return false;
      app.state = R.store.reset(app.week.key);
      app.save();
      const same = location.hash === '#/' || location.hash === '';
      location.hash = '#/';
      if (same) R.router.render();
      return true;
    },
  };
  R.app = app;

  const ROUTES = {
    '': 'home', home: 'home', matieres: 'subjects', matiere: 'subject', session: 'session',
    fin: 'summary', progres: 'progress', travail: 'worked', faibles: 'weak', dev: 'preview',
  };

  let cleanup = null;
  R.router = {
    render() {
      const root = document.getElementById('view');
      if (cleanup) { try { cleanup(); } catch (e) { /* ignore */ } cleanup = null; }
      root.innerHTML = '';
      const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
      const name = ROUTES[parts[0]] || 'home';
      const view = R.views[name];
      document.body.dataset.view = name;
      const ret = view(root, parts.slice(1));
      if (typeof ret === 'function') cleanup = ret;
      if (name !== 'session') window.scrollTo(0, 0);
    },
    start() {
      window.addEventListener('hashchange', R.router.render);
      R.router.render();
    },
  };

  // Petits blocs partagés
  R.views.topbar = function (title, backHref) {
    return el('div', { class: 'topbar' },
      el('a', { class: 'icon-btn', href: backHref || '#/', 'aria-label': 'Retour' }, '←'),
